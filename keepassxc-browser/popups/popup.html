<!DOCTYPE html>
<html>
  <head>
    <title data-i18n="popupTitle"></title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../fonts/fork-awesome.min.css">
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="popup.css">
    <script src="../common/browser-polyfill.min.js"></script>
    <script src="../common/global.js"></script>
    <script src="../common/global_ui.js"></script>
    <script src="../bootstrap/bootstrap.min.js"></script>
    <script src="popup_functions.js"></script>
    <script defer src="popup.js"></script>
    <script defer src="../common/translate.js"></script>
  </head>
  <body>
    <div class="container">
      <header id="settings" class="settings">
        <div class="brand">
          <img class="brand-logo" src="../icons/keepassxc.svg" alt="">
          <span class="brand-name">OpenVireo</span>
        </div>
        <div class="action-buttons-area">
          <button id="choose-custom-login-fields-button" class="btn icon-btn" data-i18n="[title]popupChooseCredentialsText">
            <i class="fa fa-crosshairs" aria-hidden="true"></i>
          </button>
          <button id="options-button" class="btn icon-btn" data-i18n="[title]popupSettingsText">
            <i class="fa fa-cog" aria-hidden="true"></i>
          </button>
          <button id="lock-database-button" class="btn icon-btn" data-i18n="[title]lockDatabase">
            <i class="fa fa-lock" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div id="popup-alerts">
        <div id="update-available" class="alert alert-warning">
          <span data-i18n="popupUpdateAvailable"></span>
          <br>
          <a target="_blank" class="alert-link" href="https://openvireo.com/download"><span data-i18n="popupDownloadNewVersion"></span></a>.
        </div>

        <div id="getting-started-guide" class="alert alert-info alert-dismissible">
          <span data-i18n="popupGettingStartedText"></span>
          <br>
          <a target="_blank" class="alert-link" href="https://openvireo.com/docs/OpenVireo_GettingStarted.html#_browser_integration"><span data-i18n="popupGettingStartedLinkText"></span></a>
          <button type="button" id="getting-started-alert-close-button" class="btn-close" data-bs-dismiss="alert" data-i18n="[title]popupAlertHide"></button>
        </div>

        <div id="troubleshooting-guide" class="alert alert-info alert-dismissible">
          <span data-i18n="popupTroubleshootingText"></span>
          <br>
          <a target="_blank" class="alert-link" href="https://github.com/openvireo/openvireo-browser/wiki/Troubleshooting-guide"><span data-i18n="popupTroubleshootingLinkText"></span></a>
          <button type="button" id="troubleshooting-guide-alert-close-button" class="btn-close" data-bs-dismiss="alert" data-i18n="[title]popupAlertHide"></button>
        </div>
      </div>

      <div id="initial-state" class="status-card status-card--loading">
        <div class="status-row">
          <div class="loader"></div>
          <div class="status-body"><p data-i18n="popupCheckingStatus"></p></div>
        </div>
      </div>

      <section id="not-configured" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--neutral"><i class="fa fa-link" aria-hidden="true"></i></span>
          <div class="status-body">
            <p data-i18n="popupNotConfigured"></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="connect-button" class="btn btn-primary" data-i18n="[title]connectButtonTitle">
            <i class="fa fa-link" aria-hidden="true"></i>
            <span data-i18n="popupConnectButton"></span>
          </button>
        </div>
      </section>

      <section id="need-reconfigure" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--warning"><i class="fa fa-exclamation-triangle" aria-hidden="true"></i></span>
          <div class="status-body">
            <p data-i18n="popupNeedReconfigure"></p>
            <p class="detail"><code id="need-reconfigure-message"></code></p>
            <p class="muted" data-i18n="popupNeedReconfigureMessage"></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="reconnect-button" class="btn btn-primary" data-i18n="[title]reconnectButtonTitle">
            <i class="fa fa-refresh" aria-hidden="true"></i>
            <span data-i18n="popupReconnectButton"></span>
          </button>
        </div>
      </section>

      <section id="configured-not-associated" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--warning"><i class="fa fa-unlink" aria-hidden="true"></i></span>
          <div class="status-body">
            <p><span data-i18n="popupConfiguredNotAssociated" data-i18n-placeholder="<span class='identifier' id='unassociated-identifier'></span>"></span></p>
          </div>
        </div>
      </section>

      <section id="configured-and-associated" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--success"><i class="fa fa-check" aria-hidden="true"></i></span>
          <div class="status-body">
            <p class="status-title" data-i18n="popupConnectedTitle"></p>
            <p class="muted" data-i18n="popupConfiguredAndAssociated" data-i18n-placeholder="<span class='identifier' id='associated-identifier'></span>"></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="redetect-fields-button" class="btn btn-primary" data-i18n="[title]redetectButtonTitle">
            <i class="fa fa-search" aria-hidden="true"></i>
            <span data-i18n="popupRedetectButton"></span>
          </button>
        </div>
      </section>

      <section id="error-encountered" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--danger"><i class="fa fa-exclamation-circle" aria-hidden="true"></i></span>
          <div class="status-body">
            <p data-i18n="popupErrorEncountered"></p>
            <p class="detail"><code id="error-message"></code></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="reload-status-button" class="btn btn-primary" data-i18n="[title]reloadButtonTitle">
            <i class="fa fa-refresh" aria-hidden="true"></i>
            <span data-i18n="popupReloadButton"></span>
          </button>
        </div>
      </section>

      <section id="database-not-opened" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--locked"><i class="fa fa-lock" aria-hidden="true"></i></span>
          <div class="status-body">
            <p data-i18n="popupErrorEncountered"></p>
            <p class="detail"><code id="database-error-message"></code></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="reopen-database-button" class="btn btn-primary" data-i18n="[title]reopenDatabaseButtonTitle">
            <i class="fa fa-unlock-alt" aria-hidden="true"></i>
            <span data-i18n="popupReopenButton"></span>
          </button>
        </div>
      </section>

      <section id="username-field-detected" class="status-card">
        <div class="status-row">
          <span class="status-badge status-badge--neutral"><i class="fa fa-user" aria-hidden="true"></i></span>
          <div class="status-body">
            <p data-i18n="popupUsernameFieldDetected"></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="username-only-button" class="btn btn-primary" data-i18n="[title]usernameButtonTitle">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <span data-i18n="popupUsernameButton"></span>
          </button>
        </div>
      </section>

      <section id="iframe-detected" class="status-card" style="display: none">
        <div class="status-row">
          <span class="status-badge status-badge--neutral"><i class="fa fa-window-maximize" aria-hidden="true"></i></span>
          <div class="status-body">
            <p data-i18n="popupIframeDetected"></p>
          </div>
        </div>
        <div class="status-actions">
          <button id="allow-iframe-button" class="btn btn-primary" data-i18n="[title]allowIframeButtonTitle">
            <i class="fa fa-plus" aria-hidden="true"></i>
            <span data-i18n="popupAllowIframeButton"></span>
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
